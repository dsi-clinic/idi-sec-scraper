
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idi_sec_scraper"]

[project]
name = "idi-sec-scraper"
version = "0.1.1a6"
description = "Scrapes security filings data from the SEC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "idi-ftm2j-shared>=0.1.13",
    "beautifulsoup4>=4.12.0",
    "boto3>=1.42.70",
    "idna>=3.15",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "requests>=2.33.0",
    "s3fs>=2026.3.0",
    "smart-open>=7.5.1",
    "urllib3>=2.6.3",
    "pyyaml>=6.0",
]

[project.scripts]
sec-scraper = "idi_sec_scraper.orchestrator:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.8.0",
    "pip-audit>=2.10.0",
]

[dependency-groups]
pulumi = [
    "pulumi>=3.220.0",
    "pulumi-aws>=7.19.0",
    "pip>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
  "ANN",
  "B",
  "C4",
  "D",
  "I",
  "N801",
  "N804",
  "N805",
  "PD",
  "PLR2004",
  "PTH",
  "Q",
  "S",
  "UP",
  "YTT",
]

ignore = [
  "D415",
  "ANN002",
  "ANN003",
  "ANN101",
  "B905",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "ANN001",
  "ANN201",
  "ANN202",
  "ANN204",
  "D102",
  "PLR2004",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
